<!doctype html>
<html lang="sv">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,interactive-widget=resizes-content">
<meta name="theme-color" content="#0a0c18">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<title>Agentkåren</title>
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<style>
:root{
  --bg:#0a0c18;--glass:rgba(255,255,255,.06);--glass2:rgba(255,255,255,.1);--line:rgba(255,255,255,.12);
  --tx:#eef0ff;--mut:#9aa0c3;--pri:#8ab4ff;--ok:#7ef0c1;--err:#ff7a8a;--r:22px;
  font-family:"Inter",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;background:var(--bg);color:var(--tx)}
body{display:flex;flex-direction:column;overflow:hidden}
.aurora{position:fixed;inset:0;z-index:-1;overflow:hidden;filter:blur(70px) saturate(140%);opacity:.55}
.aurora i{position:absolute;width:60vmax;height:60vmax;border-radius:50%;animation:drift 22s ease-in-out infinite alternate}
.aurora i:nth-child(1){background:#3b5bff;left:-20vmax;top:-25vmax}
.aurora i:nth-child(2){background:#a43bff;right:-25vmax;top:10vmax;animation-duration:28s}
.aurora i:nth-child(3){background:#00c9a7;left:10vmax;bottom:-35vmax;animation-duration:34s;opacity:.6}
@keyframes drift{to{transform:translate(8vmax,6vmax) scale(1.15) rotate(40deg)}}
button{font:inherit;color:inherit;border:0;background:none;cursor:pointer}
header{display:flex;align-items:center;gap:10px;padding:calc(env(safe-area-inset-top) + 12px) 16px 8px}
.logo{width:38px;height:38px;border-radius:12px;display:grid;place-items:center;font-size:20px;background:linear-gradient(135deg,#5b7cff,#b65bff);box-shadow:0 6px 20px rgba(110,90,255,.45)}
header h1{font-size:19px;margin:0;letter-spacing:.3px;font-weight:800}
header small{display:block;color:var(--mut);font-size:12px;font-weight:500}
.hbtn{width:40px;height:40px;border-radius:14px;background:var(--glass);border:1px solid var(--line);display:grid;place-items:center;font-size:18px;backdrop-filter:blur(14px)}
.sp{flex:1}
#prov{font-size:11px;padding:4px 9px;border-radius:99px;background:var(--glass);border:1px solid var(--line);color:var(--mut);white-space:nowrap}
.team{display:flex;gap:10px;overflow-x:auto;padding:6px 16px 10px;scrollbar-width:none}
.team::-webkit-scrollbar{display:none}
.ag{flex:0 0 auto;width:92px;padding:10px 6px 9px;border-radius:20px;background:var(--glass);border:1px solid var(--line);backdrop-filter:blur(16px);text-align:center;transition:.3s;position:relative}
.ag.new{animation:pop .6s cubic-bezier(.2,1.6,.4,1)}
@keyframes pop{from{transform:scale(.3);opacity:0}}
.orb{width:46px;height:46px;margin:0 auto 6px;border-radius:50%;display:grid;place-items:center;font-size:22px;position:relative;background:radial-gradient(circle at 30% 30%,rgba(255,255,255,.25),transparent 60%),var(--c);box-shadow:0 0 0 0 var(--c)}
.ag.on .orb{animation:pulse 1.4s infinite}
.ag.on .orb::after{content:"";position:absolute;inset:-5px;border-radius:50%;background:conic-gradient(var(--c),transparent 60%);-webkit-mask:radial-gradient(circle,transparent 62%,#000 64%);mask:radial-gradient(circle,transparent 62%,#000 64%);animation:spin 1s linear infinite}
.ag.on{border-color:var(--c);background:rgba(255,255,255,.1)}
.ag.done .orb::before{content:"✓";position:absolute;right:-4px;bottom:-4px;width:18px;height:18px;border-radius:50%;background:var(--ok);color:#042;font-size:11px;font-weight:900;display:grid;place-items:center}
@keyframes pulse{50%{box-shadow:0 0 22px 2px var(--c)}}
@keyframes spin{to{transform:rotate(360deg)}}
.ag b{display:block;font-size:12.5px}
.ag span{display:block;font-size:10.5px;color:var(--mut);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
main{flex:1;overflow-y:auto;padding:4px 14px 20px;scroll-behavior:smooth}
#hero{text-align:center;padding:26px 6px 10px}
#hero h2{font-size:27px;line-height:1.15;margin:0 0 8px;font-weight:800;background:linear-gradient(90deg,#fff,#b9c6ff,#e2b8ff);-webkit-background-clip:text;background-clip:text;color:transparent}
#hero p{color:var(--mut);margin:0 auto 18px;max-width:440px;font-size:14.5px;line-height:1.5}
.chips{display:flex;flex-direction:column;gap:8px;max-width:520px;margin:0 auto}
.chip{text-align:left;padding:12px 14px;border-radius:18px;background:var(--glass);border:1px solid var(--line);font-size:13.5px;backdrop-filter:blur(14px);transition:.2s}
.chip:active{transform:scale(.98);background:var(--glass2)}
.caps{display:flex;flex-wrap:wrap;gap:6px;justify-content:center;margin:0 0 18px}
.caps span{font-size:11.5px;padding:5px 10px;border-radius:99px;background:rgba(138,180,255,.12);color:#c8d6ff;border:1px solid rgba(138,180,255,.25)}
#feed{display:flex;flex-direction:column;gap:8px;max-width:760px;margin:0 auto}
.ev{display:flex;gap:10px;padding:10px 12px;border-radius:16px;background:var(--glass);border:1px solid var(--line);backdrop-filter:blur(14px);animation:in .35s ease;font-size:13.5px;line-height:1.45;border-left:3px solid var(--c)}
@keyframes in{from{opacity:0;transform:translateY(8px)}}
.ev .em{font-size:16px;line-height:1.3}
.ev .bd{flex:1;min-width:0;overflow-wrap:anywhere}
.ev .who{font-size:11px;font-weight:700;color:var(--c);text-transform:uppercase;letter-spacing:.6px}
.ev.think .tx{color:#c9cdea;font-style:italic}
.ev.sys{--c:#666;color:var(--mut);font-size:12.5px}
.ev.err{--c:var(--err)}
.ev details{margin-top:6px}
.ev summary{font-size:12px;color:var(--pri);cursor:pointer}
.ev pre{white-space:pre-wrap;font-size:11.5px;max-height:240px;overflow:auto;background:rgba(0,0,0,.3);padding:8px;border-radius:10px;margin:6px 0 0}
.user{align-self:flex-end;max-width:88%;padding:11px 15px;border-radius:20px 20px 6px 20px;background:linear-gradient(135deg,#4f6dff,#8f52ff);font-size:14.5px;animation:in .3s;box-shadow:0 8px 24px rgba(90,80,255,.35)}
.res{padding:16px 16px 12px;border-radius:var(--r);background:rgba(20,24,48,.72);border:1px solid rgba(138,180,255,.35);backdrop-filter:blur(20px);animation:in .5s;box-shadow:0 10px 40px rgba(0,0,0,.35)}
.res .hd{display:flex;align-items:center;gap:8px;font-weight:800;font-size:13px;color:var(--ok);margin-bottom:4px}
.md{font-size:14.5px;line-height:1.6;overflow-wrap:anywhere}
.md h2,.md h3,.md h4,.md h5{margin:14px 0 6px;line-height:1.25}
.md h2{font-size:19px}.md h3{font-size:16.5px}
.md p{margin:6px 0}.md ul,.md ol{margin:6px 0;padding-left:22px}
.md a{color:var(--pri)}
.md code{background:rgba(255,255,255,.1);padding:1px 5px;border-radius:6px;font-size:.9em}
.md pre{background:rgba(0,0,0,.4);padding:12px;border-radius:12px;overflow:auto}
.md pre code{background:none;padding:0}
.md img{max-width:100%;border-radius:14px;margin:6px 0}
.md blockquote{margin:6px 0;padding:4px 12px;border-left:3px solid var(--pri);color:#c9cdea}
.md hr{border:0;border-top:1px solid var(--line);margin:12px 0}
.tw{overflow-x:auto;margin:8px 0}
.md table{border-collapse:collapse;font-size:13px;min-width:100%}
.md th,.md td{border:1px solid var(--line);padding:6px 8px;text-align:left;vertical-align:top}
.md th{background:rgba(255,255,255,.07)}
.acts{display:flex;flex-wrap:wrap;gap:6px;margin-top:12px}
.acts button,.file{font-size:12.5px;padding:8px 12px;border-radius:99px;background:var(--glass2);border:1px solid var(--line);color:var(--tx);text-decoration:none;display:inline-flex;gap:6px;align-items:center}
.file{background:rgba(126,240,193,.12);border-color:rgba(126,240,193,.35)}
.composer{padding:8px 12px calc(env(safe-area-inset-bottom) + 10px);}
.cbox{max-width:760px;margin:0 auto;display:flex;align-items:flex-end;gap:8px;padding:8px 8px 8px 16px;border-radius:26px;background:rgba(25,28,52,.75);border:1px solid var(--line);backdrop-filter:blur(22px);box-shadow:0 -6px 30px rgba(0,0,0,.25)}
textarea{flex:1;background:none;border:0;outline:0;color:var(--tx);font:inherit;font-size:15px;resize:none;max-height:140px;padding:9px 0;line-height:1.4}
textarea::placeholder{color:#7d83a8}
#go{width:46px;height:46px;border-radius:50%;flex:0 0 auto;background:linear-gradient(135deg,#5b7cff,#a35bff);display:grid;place-items:center;font-size:19px;box-shadow:0 6px 18px rgba(110,90,255,.5);transition:.2s}
#go.stop{background:var(--err);box-shadow:0 6px 18px rgba(255,90,110,.45)}
#go:active{transform:scale(.9)}
.sub{display:flex;justify-content:center;gap:8px;margin-top:6px}
.sub button{font-size:12px;color:var(--mut);padding:4px 10px;border-radius:99px}
.sheet{position:fixed;inset:0;z-index:20;display:none}
.sheet.open{display:block}
.sheet .bk{position:absolute;inset:0;background:rgba(0,0,0,.5);backdrop-filter:blur(4px);animation:fade .25s}
@keyframes fade{from{opacity:0}}
.sheet .pn{position:absolute;left:0;right:0;bottom:0;max-height:88%;overflow:auto;background:rgba(22,25,46,.94);border-top-left-radius:28px;border-top-right-radius:28px;border:1px solid var(--line);padding:10px 18px calc(env(safe-area-inset-bottom) + 20px);animation:up .35s cubic-bezier(.2,.9,.3,1);max-width:760px;margin:0 auto;backdrop-filter:blur(24px)}
@keyframes up{from{transform:translateY(100%)}}
.grab{width:42px;height:5px;border-radius:9px;background:#555b80;margin:2px auto 12px}
.pn h3{margin:4px 0 4px;font-size:20px}
.pn .hint{color:var(--mut);font-size:12.5px;margin:0 0 12px;line-height:1.45}
.fld{margin:12px 0}
.fld label{display:block;font-size:12.5px;color:var(--mut);margin-bottom:5px;font-weight:600}
.fld input,.fld select{width:100%;padding:12px 14px;border-radius:14px;background:rgba(255,255,255,.07);border:1px solid var(--line);color:var(--tx);font:inherit;font-size:14px;outline:0}
.fld input:focus,.fld select:focus{border-color:var(--pri)}
.fld small{display:block;color:#7d83a8;font-size:11.5px;margin-top:4px}
.fld small a{color:var(--pri)}
.row2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.prim{width:100%;padding:14px;border-radius:16px;background:linear-gradient(135deg,#5b7cff,#a35bff);font-weight:700;margin-top:10px}
.hi{padding:12px 14px;border-radius:16px;background:var(--glass);border:1px solid var(--line);margin:8px 0;cursor:pointer}
.hi b{display:block;font-size:14px;margin-bottom:3px}
.hi span{font-size:11.5px;color:var(--mut)}
.toast{position:fixed;left:50%;bottom:110px;transform:translateX(-50%);background:rgba(30,34,64,.95);border:1px solid var(--line);padding:10px 16px;border-radius:99px;font-size:13px;z-index:30;animation:in .3s}
#office{position:relative;height:38vh;min-height:210px;margin:2px 12px 8px;border-radius:24px;overflow:hidden;border:1px solid var(--line);display:none;transition:height .45s cubic-bezier(.2,.9,.3,1);box-shadow:0 10px 40px rgba(0,0,0,.4);background:#141726}
body.has3d #office{display:block}body.has3d .team{display:none}
#office.big{height:66vh}
#gl{position:absolute;inset:0;width:100%;height:100%;touch-action:none;image-rendering:auto;filter:saturate(1.12) contrast(1.05)}
#office::after{content:"";position:absolute;inset:0;pointer-events:none;background:repeating-linear-gradient(0deg,rgba(0,0,0,.09) 0 1px,transparent 1px 3px),radial-gradient(ellipse at center,transparent 55%,rgba(0,0,0,.55));z-index:2}
.tag{position:absolute;left:0;top:0;z-index:3;pointer-events:auto;cursor:pointer;padding:4px 8px 5px;border-radius:10px;background:rgba(10,12,28,.72);border:1px solid rgba(255,255,255,.15);text-align:center;white-space:nowrap;backdrop-filter:blur(6px);font-size:10px;line-height:1.25;transition:border-color .3s,background .3s}
.tag b{display:block;font-size:10.5px}.tag span{display:block;color:var(--mut);font-size:9.5px;max-width:110px;overflow:hidden;text-overflow:ellipsis}
.tag.on{border-color:var(--c);background:rgba(20,24,52,.9);box-shadow:0 0 14px var(--c)}.tag.on span{color:#fff}
.tag.done span{color:var(--ok)}
.tag::after{content:"";position:absolute;left:50%;bottom:-5px;margin-left:-5px;border:5px solid transparent;border-bottom:0;border-top-color:rgba(10,12,28,.72)}
#bBig{position:absolute;right:10px;bottom:10px;z-index:4;width:34px;height:34px;border-radius:11px;background:rgba(10,12,28,.6);border:1px solid var(--line);font-size:15px;backdrop-filter:blur(8px)}
.offlbl{position:absolute;left:12px;bottom:12px;z-index:4;font:700 10px/1 monospace;letter-spacing:1px;color:#8ab4ff;opacity:.75;pointer-events:none}
body.has3d #hero{padding-top:12px}body.has3d #hero h2{font-size:22px}body.has3d .caps{display:none}
h4.sec{margin:20px 0 4px;font-size:13px;color:var(--pri);text-transform:uppercase;letter-spacing:.8px}
</style>
</head>
<body>
<div class="aurora"><i></i><i></i><i></i></div>

<header>
  <div class="logo">🛰️</div>
  <div><h1>Agentkåren</h1><small>Ditt AI-team som gör vad du ber om</small></div>
  <div class="sp"></div>
  <span id="prov">⚡ –</span>
  <button class="hbtn" id="bHist" title="Historik">🕘</button>
  <button class="hbtn" id="bSet" title="Inställningar">⚙️</button>
</header>

<section class="team" id="team"></section>
<div id="office"><canvas id="gl"></canvas><button id="bBig" title="Förstora">⛶</button><div class="offlbl">● LIVE · KONTORET</div></div>

<main id="main">
  <div id="hero">
    <h2>Vad ska teamet göra?</h2>
    <p>Beskriv uppdraget. Chefen delar upp det, delegerar till specialister – och anställer nya agenter vid behov.</p>
    <div class="caps"><span>🔎 Webbsök</span><span>🕷️ Skrapning</span><span>📄 Läs sidor</span><span>🧮 Kör kod</span><span>🔌 API:er</span><span>🎨 Bilder</span><span>💾 Filer</span><span>👥 Parallellt</span><span>💪 Ger aldrig upp</span></div>
    <div class="chips" id="chips"></div>
  </div>
  <div id="feed"></div>
</main>

<footer class="composer">
  <div class="cbox">
    <textarea id="inp" rows="1" placeholder="Ge teamet ett uppdrag…"></textarea>
    <button id="go" title="Skicka">➤</button>
  </div>
  <div class="sub"><button id="bNew">＋ Nytt uppdrag</button></div>
</footer>

<div class="sheet" id="sheet"><div class="bk"></div><div class="pn" id="pn"></div></div>

<script>
'use strict';
/* ========== Hjälpare ========== */
const $=s=>document.querySelector(s);
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const trunc=(s,n)=>{s=String(s??'');return s.length>n?s.slice(0,n)+`\n…[avkortat, ${s.length-n} tecken till]`:s};
const clean=s=>String(s||'').replace(/\s+/g,' ').trim();
function sleep(ms){return new Promise((res,rej)=>{const t=setTimeout(res,ms);RUN.ctrl?.signal.addEventListener('abort',()=>{clearTimeout(t);rej(new DOMException('Stoppad','AbortError'))},{once:true})})}
function toast(t){const d=document.createElement('div');d.className='toast';d.textContent=t;document.body.append(d);setTimeout(()=>d.remove(),2200)}
const isAbort=e=>e?.name==='AbortError'&&RUN.ctrl?.signal.aborted;
function checkAbort(){if(RUN.ctrl?.signal.aborted)throw new DOMException('Stoppad','AbortError')}
function anySignal(a){if(AbortSignal.any)return AbortSignal.any(a);const c=new AbortController();a.forEach(s=>s.addEventListener('abort',()=>c.abort(),{once:true}));return c.signal}
let NOSIG=false; // vissa förhandsvisningar (t.ex. Claude-appen) proxar fetch via postMessage och kan inte klona AbortSignal
async function tfetch(url,opt={},ms=20000){
  const c=new AbortController();let t;
  const sig=RUN.ctrl?anySignal([c.signal,RUN.ctrl.signal]):c.signal;
  const guard=new Promise((_,rej)=>{t=setTimeout(()=>{c.abort();rej(new DOMException('Timeout','AbortError'))},ms);sig.addEventListener('abort',()=>rej(new DOMException('Stoppad','AbortError')),{once:true})});
  guard.catch(()=>{});
  try{
    if(!NOSIG){try{return await Promise.race([fetch(url,{...opt,signal:sig}),guard])}catch(e){if(/clone|postMessage/i.test(e?.message||''))NOSIG=true;else throw e}}
    return await Promise.race([fetch(url,opt),guard]);
  }finally{clearTimeout(t)}
}

/* ========== Inställningar ========== */
const DEF={provider:'auto',keys:{gemini:'',groq:'',openrouter:'',pollinations:'',custom:''},
  models:{gemini:'gemini-2.5-flash',groq:'llama-3.3-70b-versatile',openrouter:'meta-llama/llama-3.3-70b-instruct:free',pollinations:'openai',custom:''},
  customUrl:'',proxy:'',maxSteps:20,subSteps:12};
let S;try{const o=JSON.parse(localStorage.ak_set||'{}');S={...DEF,...o,keys:{...DEF.keys,...o.keys},models:{...DEF.models,...o.models}}}catch{S=structuredClone(DEF)}
const saveS=()=>localStorage.ak_set=JSON.stringify(S);

const PROV={
  gemini:{name:'Gemini',url:()=>'https://generativelanguage.googleapis.com/v1beta/openai/chat/completions',link:'https://aistudio.google.com/apikey'},
  groq:{name:'Groq',url:()=>'https://api.groq.com/openai/v1/chat/completions',link:'https://console.groq.com/keys'},
  openrouter:{name:'OpenRouter',url:()=>'https://openrouter.ai/api/v1/chat/completions',link:'https://openrouter.ai/keys'},
  pollinations:{name:'Pollinations',url:()=>S.keys.pollinations?'https://gen.pollinations.ai/v1/chat/completions':'https://text.pollinations.ai/openai',link:'https://enter.pollinations.ai'},
  custom:{name:'Egen',url:()=>S.customUrl}
};
function provOrder(){
  if(S.provider!=='auto')return S.provider==='pollinations'?['pollinations']:[S.provider,'pollinations'];
  const o=['gemini','groq','openrouter','pollinations','custom'].filter(p=>S.keys[p]&&(p!=='custom'||S.customUrl));
  if(!o.includes('pollinations'))o.push('pollinations');return o;
}
function setProvBadge(p){$('#prov').textContent='⚡ '+(p?PROV[p].name:provOrder().map(x=>PROV[x].name)[0])}

/* ========== LLM ========== */
let CALLS=0;
async function callProvider(p,messages){
  const P=PROV[p];
  for(let a=0;a<4;a++){
    checkAbort();
    const body={model:S.models[p]||undefined,messages,temperature:.4};
    if(p==='pollinations'&&!S.keys.pollinations)body.referrer='agentkaren';
    const r=await tfetch(P.url(),{method:'POST',headers:{'Content-Type':'application/json',...(S.keys[p]?{Authorization:'Bearer '+S.keys[p]}:{})},body:JSON.stringify(body)},90000);
    if(r.status===429||r.status===503||r.status===502){
      const w=(+r.headers.get('retry-after')||0)*1000||7000*(a+1);
      sys(`${P.name}: kvot/överbelastning – väntar ${Math.round(w/1000)} s…`);await sleep(Math.min(w,45000));continue;
    }
    if(!r.ok)throw new Error(`${P.name} ${r.status}: ${(await r.text()).slice(0,200)}`);
    const j=await r.json();let c=j.choices?.[0]?.message?.content;
    if(Array.isArray(c))c=c.map(x=>x.text||'').join('');
    if(!c)throw new Error(P.name+': tomt svar');
    CALLS++;setProvBadge(p);return c;
  }
  throw new Error(P.name+': för många försök');
}
async function llm(messages){
  let last;
  for(const p of provOrder()){
    try{return await callProvider(p,messages)}catch(e){if(isAbort(e))throw e;last=e;sys('⚠️ '+e.message+' – provar nästa leverantör')}
  }
  throw last||new Error('Ingen AI-leverantör tillgänglig');
}

/* ========== Webb / skrapning ========== */
const PROXIES=[
  u=>u,
  u=>S.proxy?S.proxy.replace('{url}',encodeURIComponent(u)):null,
  u=>'https://api.allorigins.win/raw?url='+encodeURIComponent(u),
  u=>'https://api.codetabs.com/v1/proxy/?quest='+encodeURIComponent(u),
  u=>'https://corsproxy.io/?url='+encodeURIComponent(u),
];
function normUrl(u){u=String(u||'').trim();if(!u)throw new Error('url saknas');if(!/^https?:\/\//i.test(u))u='https://'+u;return u}
async function fetchRaw(url){
  url=normUrl(url);const errs=[];
  for(const f of PROXIES){
    const pu=f(url);if(!pu)continue;
    try{
      const r=await tfetch(pu,{},pu===url?8000:20000);
      if(!r.ok){errs.push(r.status);continue}
      const t=await r.text();if(t.length<30){errs.push('tomt');continue}
      return t;
    }catch(e){if(isAbort(e))throw e;errs.push(e.name==='AbortError'?'timeout':'blockerad')}
  }
  try{const r=await tfetch('https://r.jina.ai/'+url,{headers:{'X-Return-Format':'html'}},35000);if(r.ok)return await r.text()}catch(e){if(isAbort(e))throw e}
  throw new Error(`Kunde inte hämta ${url} (${errs.join(', ')})`);
}
const parseDoc=html=>new DOMParser().parseFromString(html,'text/html');

function htmlToText(html){

    .replace(/<(\/?)(p|div|br|li|h[1-6]|tr|section|article|header|footer|ul|ol|table|blockquote|pre)\b/gi,'\n<$1$2');
  const d=parseDoc(html);const title=d.title||'';
  const t=(d.body?.textContent||'').replace(/[ \t\u00a0]+/g,' ').replace(/\n\s*\n+/g,'\n\n').trim();

async function scrape({url,selector,attr='text',limit=60}){
  if(!selector)throw new Error('selector saknas');
  url=normUrl(url);const d=parseDoc(await fetchRaw(url));
  let els;try{els=[...d.querySelectorAll(selector)]}catch{throw new Error('Ogiltig CSS-selektor: '+selector)}
  if(!els.length){
    const cnt={};d.querySelectorAll('[class]').forEach(e=>e.classList.forEach(c=>cnt[c]=(cnt[c]||0)+1));
    const top=Object.entries(cnt).sort((a,b)=>b[1]-a[1]).slice(0,40).map(([c,n])=>`.${c}(${n})`).join(' ');
    return `0 träffar för "${selector}". Sidan kan vara JS-renderad – testa read_page. Vanliga klasser: ${top}`;
  }
  const sel=els.slice(0,Math.min(+limit||60,200));
  const out=sel.map(el=>{
    if(attr==='text')return clean(el.textContent);
    if(attr==='html')return el.outerHTML.slice(0,700);
    const v=el.getAttribute(attr);return (attr==='href'||attr==='src')&&v?abs(v,url):v;
  }).filter(x=>x!=null&&x!=='');
  return {url,selector,traffar:els.length,data:out};
}
async function links({url,filter=''}){
  url=normUrl(url);const d=parseDoc(await fetchRaw(url));const f=String(filter).toLowerCase();const seen=new Set();const out=[];
  d.querySelectorAll('a[href]').forEach(a=>{
    const h=abs(a.getAttribute('href'),url);if(!/^https?:/.test(h)||seen.has(h))return;
    const t=clean(a.textContent).slice(0,90);if(f&&!(t.toLowerCase().includes(f)||h.toLowerCase().includes(f)))return;
    seen.add(h);out.push(`${t||'(ingen text)'} → ${h}`);
  });
  return `${out.length} länkar:\n`+out.slice(0,120).join('\n');
}

async function search({query,n=8}){

  try{

    const res=[...d.querySelectorAll('.result:not(.result--ad)')].map(r=>{const a=r.querySelector('.result__a');return a&&{titel:clean(a.textContent),url:ddg(a.getAttribute('href')),utdrag:clean(r.querySelector('.result__snippet')?.textContent)}}).filter(x=>x&&x.url).slice(0,n);
    if(res.length)return res;
  }catch(e){if(isAbort(e))throw e}
  try{
    const d=parseDoc(await fetchRaw('https://lite.duckduckgo.com/lite/?q='+q));
    const res=[...d.querySelectorAll('a.result-link')].map(a=>({titel:clean(a.textContent),url:ddg(a.getAttribute('href'))})).slice(0,n);
    if(res.length)return res;
  }catch(e){if(isAbort(e))throw e}
  try{const r=await tfetch('https://r.jina.ai/https://www.bing.com/search?q='+q,{},35000);if(r.ok){const t=await r.text();if(t.length>300)return 'Sökresultat (Bing, råtext):\n'+trunc(t,7000)}}catch(e){if(isAbort(e))throw e}
  const r=await tfetch(`https://sv.wikipedia.org/w/api.php?action=query&list=search&srsearch=${q}&format=json&origin=*&srlimit=${n}`);
  const j=await r.json();return (j.query?.search||[]).map(s=>({titel:s.title,url:'https://sv.wikipedia.org/wiki/'+encodeURIComponent(s.title.replace(/ /g,'_')),utdrag:clean(s.snippet.replace(/<[^>]+>/g,''))}));
}

function runJs({code,input=null}){
  return new Promise((res)=>{
    const src=`const __l=[];const console={log:(...a)=>__l.push(a.map(x=>typeof x==='object'?JSON.stringify(x):String(x)).join(' ')),error:(...a)=>__l.push('ERR '+a.join(' ')),warn:(...a)=>__l.push(a.join(' '))};
onmessage=async e=>{try{const F=Object.getPrototypeOf(async function(){}).constructor;const r=await new F('input',e.data.code)(e.data.input);let v=r;try{v=JSON.parse(JSON.stringify(r??null))}catch{v=String(r)}postMessage({ok:true,v,l:__l})}catch(err){postMessage({ok:false,e:String(err&&err.stack||err),l:__l})}}`;
    const url=URL.createObjectURL(new Blob([src],{type:'text/javascript'}));const w=new Worker(url);
    const done=o=>{w.terminate();URL.revokeObjectURL(url);clearTimeout(t);res(o)};
    const t=setTimeout(()=>done('FEL: timeout efter 20 s'),20000);
    RUN.ctrl?.signal.addEventListener('abort',()=>done('Stoppad'),{once:true});
    w.onmessage=e=>{const m=e.data;done((m.l.length?'console:\n'+m.l.join('\n')+'\n\n':'')+(m.ok?'return: '+(typeof m.v==='string'?m.v:JSON.stringify(m.v,null,1)):'FEL: '+m.e))};
    w.onerror=e=>{e.preventDefault();done('FEL: '+e.message)};
    w.postMessage({code:String(code||''),input});
  });
}

function sanitizeJson(s){
  let o='',inS=false,e=false;
  for(const ch of s){
    if(inS){if(e){e=false;o+=ch;continue}if(ch==='\\'){e=true;o+=ch;continue}if(ch==='"'){inS=false;o+=ch;continue}
      if(ch==='\n'){o+='\\n';continue}if(ch==='\r')continue;if(ch==='\t'){o+='\\t';continue}o+=ch}
    else{if(ch==='"')inS=true;o+=ch}
  }return o;
}
function parseAction(txt){
  let t=String(txt).trim().replace(/^```(?:json)?\s*/i,'').replace(/```\s*$/,'');
  const s=t.indexOf('{'),e=t.lastIndexOf('}');if(s<0||e<=s)return null;
  const j=t.slice(s,e+1);
  try{return JSON.parse(j)}catch{try{return JSON.parse(sanitizeJson(j))}catch{return null}}
}
function compact(m){

  for(let i=1;i<m.length-6&&tot>50000;i++){

}

async function runAgent(id,task,depth,msgs){
  const A=AG[id];const max=depth?S.subSteps:S.maxSteps;
  const m=msgs||[{role:'system',content:''}];m.push({role:'user',content:task});
  let fails=0,push=0;
  for(let step=0;step<max;step++){
    checkAbort();m[0].content=sysPrompt(A);compact(m);
    status(id,'Tänker…',1);
    const raw=await llm(m);m.push({role:'assistant',content:raw});
    const act=parseAction(raw);
    if(!act||(!act.tool&&act.final==null)){
      if(++fails>=2&&raw.trim()&&!act){status(id,'Klar',0,1);return raw.trim()}
      m.push({role:'user',content:'Fel format. Svara ENDAST med ett giltigt JSON-objekt enligt PROTOKOLL.'});continue;
    }
    fails=0;
    if(act.thought){emit(id,'think',act.thought);window.OFFICE?.log(id,'💭 '+act.thought)}
    if(act.final!=null&&!act.tool){
      const fin=typeof act.final==='string'?act.final:JSON.stringify(act.final,null,2);
      if(GIVEUP.test(fin.slice(0,700))&&push<3&&step<max-2){push++;
        emit(depth?'chef':id,'hand',depth?`💪 → <b>${esc(A.name)}</b>: Ge inte upp – hitta en annan väg!`:'💪 Ger inte upp – testar en ny strategi',null,true);
        window.OFFICE?.log(depth?'chef':id,'💪 Ge inte upp!');
        m.push({role:'user',content:'Avböj inte och ge inte upp. Det finns nästan alltid en annan väg: andra källor, sök efter ett öppet API eller RSS, read_page, skriv egen kod med run_js'+(A.tools.includes('delegate')?', delegera till en specialist eller anställ en ny':'')+'. Prova en helt ny strategi nu och leverera bästa möjliga resultat.'});continue}
      status(id,'Klar',0,1);return fin}
    const tn=act.tool;
    if(!TOOLDOC[tn]||!A.tools.includes(tn)){m.push({role:'user',content:`Verktyget "${tn}" finns inte för dig. Tillåtna: ${A.tools.join(', ')}`});continue}
    const [lab,ico]=TOOLDOC[tn];status(id,lab+'…',1);window.OFFICE?.log(id,`${ico} ${lab}: ${argSum(tn,act.args)}`);
    const ev=tn.startsWith('delegate')?null:emit(id,'tool',`<b>${ico} ${lab}</b> ${esc(argSum(tn,act.args))}`,null,true);
    let out;
    try{out=await TOOLS[tn](act.args||{},{agent:id,depth})}catch(e){if(isAbort(e))throw e;out='FEL: '+e.message}
    const s=typeof out==='string'?out:JSON.stringify(out,null,1);
    if(ev)detail(ev,s);window.OFFICE?.log(id,(s.startsWith('FEL')?'✗ ':'✓ ')+s.slice(0,60));
    m.push({role:'user',content:`RESULTAT (${tn}):\n${trunc(s,7000)}\n\n[Steg ${step+1}/${max}]${step>=max-2?' Snart slut på steg – avsluta med final.':''}`});
  }
  m.push({role:'user',content:'Stegen är slut. Ge slutsvaret NU som {"final":"..."} med allt du hittat.'});
  const raw=await llm(m);m.push({role:'assistant',content:raw});const a=parseAction(raw);status(id,'Klar',0,1);
  return a?.final??raw;
}
const GIVEUP=/(kan (tyvärr |dessvärre )?inte|kunde (tyvärr |dessvärre )?inte|går (tyvärr )?inte|lyckades inte|misslyckades|omöjligt|inte möjligt|tyvärr|beklagar|ber om ursäkt|har (inte|ingen) (möjlighet|tillgång)|saknar (möjlighet|tillgång)|utanför (min|mina)|I can(no|')t|cannot|unable to|not able to|I'm sorry|I am sorry|I apologi[sz]e)/i;
const slug=s=>String(s||'agent').toLowerCase().normalize('NFD').replace(/[\u0300-\u036f]/g,'').replace(/[^a-z0-9]+/g,'-').replace(/^-|-$/g,'')||'agent';
async function delegate({agent,task,role},ctx){
  if(ctx.depth>=1)return 'FEL: endast Chef kan delegera.';
  if(!task)return 'FEL: task saknas.';
  const id=slug(agent);
  if(!AG[id])hire(id,String(agent).replace(/^./,c=>c.toUpperCase()),role||('Specialist på '+agent+'.'));
  window.OFFICE?.handoff(ctx.agent,id);window.OFFICE?.log(ctx.agent,'📨 → '+AG[id].name);
  emit(ctx.agent,'hand',`📨 → <b>${esc(AG[id].name)}</b>: ${esc(clean(task).slice(0,220))}`,null,true);
  let r=await runAgent(id,task,ctx.depth+1);
  for(let tries=0;tries<2&&GIVEUP.test(r.slice(0,700));tries++){
    emit(ctx.agent,'hand',`🔁 → <b>${esc(AG[id].name)}</b>: Inte godkänt. Nytt försök med helt ny strategi!`,null,true);
    window.OFFICE?.handoff(ctx.agent,id);window.OFFICE?.log(ctx.agent,'🔁 Nytt försök: '+AG[id].name);
    r=await runAgent(id,`${task}\n\nDITT FÖRRA FÖRSÖK GODKÄNDES INTE:\n${r.slice(0,1500)}\n\nAvböj inte. Använd en helt annan strategi (andra källor, öppna API:er, RSS, read_page, egen kod med run_js) och leverera ett konkret resultat.`,ctx.depth+1);
  }
  const ev=emit(id,'done',`✅ Rapport till Chef`,null,true);detail(ev,r);
  return `RAPPORT från ${AG[id].name}:\n${r}`;
}
async function delegateParallel({jobs=[]},ctx){
  const js=jobs.slice(0,4);if(!js.length)return 'FEL: jobs saknas.';
  const rs=await Promise.all(js.map(j=>delegate(j,ctx).catch(e=>{if(isAbort(e))throw e;return `FEL från ${j.agent}: ${e.message}`})));
  return rs.join('\n\n---\n\n');
}

  };

  inp.value='';autosize();$('#hero').style.display='none';
  RUN={busy:true,ctrl:new AbortController()};go.classList.add('stop');go.textContent='■';
  userBubble(task);resetTeam();
  const fresh=!CONV;if(fresh){CONV=[{role:'system',content:''}];FILES=[];NOTES=[];CUR={id:Date.now(),task,turns:[]};window.OFFICE?.task(task)}
  const before=FILES.length;
  try{
    const final=await runAgent('chef',fresh?task:`Uppföljning från användaren: ${task}`,0,CONV);
    showResult(final,FILES);
    CUR.turns.push({q:task,a:final});CUR.files=FILES;saveHist(CUR);

  }else if(A.state==='think'){
    set(L1.sh,.75);set(L1.el,.85);set(R1.sh,.35);set(R1.el,2.35);R1.sh.rotation.z=-.15;
    A.head.rotation.z=lerp(A.head.rotation.z,Math.sin(ph*1.3)*.12,dt*4);A.head.rotation.x=lerp(A.head.rotation.x,-.12,dt*4);A.head.rotation.y=lerp(A.head.rotation.y,Math.sin(ph*.5)*.35,dt*2);
  }else{
    set(L1.sh,.55,.5);set(L1.el,.7,.5);set(R1.sh,.55,.5);set(R1.el,.7,.5);
    A.head.rotation.x=lerp(A.head.rotation.x,0,dt*3);A.head.rotation.z=lerp(A.head.rotation.z,0,dt*3);A.head.rotation.y=lerp(A.head.rotation.y,Math.sin(ph*.35)*.55,dt*1.5);
  }
}
function loop(){
  requestAnimationFrame(loop);if(document.hidden)return;
  const dt=Math.min(.05,clock.getDelta());tNow+=dt;const t=tNow;
  for(const id in agents){const A=agents[id];pose(A,t,dt);
    if(A.grow!=null&&A.grow<1){A.grow=Math.min(1,A.grow+dt*1.4);const s=A.grow<1?Math.max(.01,1.08*Math.sin(A.grow*PI*.55)):1;A.desk.scale.setScalar(s);if(A.grow>=1)A.desk.scale.setScalar(1)}
    if(t-A.lastDraw>(A.state==='idle'?.2:.12)){A.lastDraw=t;drawScreen(A,t)}}
  for(let i=planes.length-1;i>=0;i--){const p=planes[i];p.t+=dt/1.3;const k=Math.min(1,p.t);const pos=new V3().lerpVectors(p.a,p.b,k);pos.y+=Math.sin(k*PI)*1.1;p.m.lookAt(pos);p.m.position.copy(pos);p.m.rotation.z=Math.sin(t*12)*.3;if(k>=1){scene.remove(p.m);planes.splice(i,1)}}
  flickM.color.setScalar(Math.random()<.03?.45:1);
  clockT+=dt;if(clockT>1){clockT=0;drawClock()}
  const G=camGoal(),k=1-Math.exp(-dt*2.5);
  cur.t.lerp(G.t,k);cur.yaw=angLerp(cur.yaw,G.yaw+userYaw*(performance.now()<userUntil?1:0),k);cur.pitch=lerp(cur.pitch,G.pitch+(performance.now()<userUntil?userPitch:0),k);cur.dist=lerp(cur.dist,G.dist,k);
  if(performance.now()>userUntil){userYaw*=.98;userPitch*=.98}
  const cp=Math.cos(cur.pitch);cam.position.set(cur.t.x+Math.sin(cur.yaw)*cp*cur.dist,cur.t.y+Math.sin(cur.pitch)*cur.dist,cur.t.z+Math.cos(cur.yaw)*cp*cur.dist);
  cam.position.x=Math.max(-RW/2+.3,Math.min(RW/2-.3,cam.position.x));cam.position.y=Math.max(.4,Math.min(RH-.15,cam.position.y));cam.position.z=Math.max(RZ-RD/2+.3,Math.min(RZ+RD/2-.3,cam.position.z));
  cam.lookAt(cur.t);
  R.render(scene,cam);
  const w=wrap.clientWidth,h=wrap.clientHeight;
  for(const id in agents){const A=agents[id];A.head.getWorldPosition(tmp);tmp.y+=.45;tmp.project(cam);
    if(tmp.z>1||Math.abs(tmp.x)>1.2||Math.abs(tmp.y)>1.2){A.tag.style.display='none';continue}
    A.tag.style.display='';A.tag.style.transform=`translate(${(tmp.x*.5+.5)*w}px,${(-tmp.y*.5+.5)*h}px) translate(-50%,-100%)`;A.tag.style.zIndex=Math.round((1-tmp.z)*1000)}
}
loop();

/* ---------- API mot appen ---------- */
window.OFFICE={
  sync(AG){for(const id in AG)if(!agents[id])addAgent(id,AG[id],!!AG[id].hired);for(const id in agents)if(!AG[id])removeAgent(id)},
  status(id,txt,on,done){const A=agents[id];if(!A)return;A.txt=txt;A.tag.querySelector('span').textContent=txt;A.tag.classList.toggle('on',!!on);A.tag.classList.toggle('done',!!done);
    const prev=A.state;A.state=on?(/^Tänker/.test(txt)?'think':'work'):done?'done':'idle';if(done&&prev!=='done')A.cheer=tNow+1.8;if(!on&&!done)A.log=[]},
  log(id,line){const A=agents[id];if(!A)return;A.log.push(String(line).replace(/<[^>]+>/g,'').replace(/\s+/g,' '));if(A.log.length>40)A.log.shift()},
  handoff,
  task(t){WB.task=t;WB.notes=[];drawWB()},
  notes(n){WB.notes=n.slice();drawWB()},
};
if(window.AG)window.OFFICE.sync(window.AG);
}
</script>
